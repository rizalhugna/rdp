name: win 11 + tailscale + Download.bat script 

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Optimize Network and Core RDP Settings
        run: |
          # 1. Aktifkan Remote Desktop & Bypass NLA (Instan Login Tanpa Loading Lama)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # 2. OPTIMASI UDP & TCP FIREWALL (Respon Mouse/Ketik Instan & Lancar)
          netsh advfirewall firewall delete rule name="RDP-Tailscale-UDP" 2>\$null
          netsh advfirewall firewall add rule name="RDP-Tailscale-UDP" dir=in action=allow protocol=UDP localport=3389
          netsh advfirewall firewall delete rule name="RDP-Tailscale-TCP" 2>\$null
          netsh advfirewall firewall add rule name="RDP-Tailscale-TCP" dir=in action=allow protocol=TCP localport=3389

          # 3. TWEAK REGISTRY WINDOWS (Performa Grafis RDP Tertinggi & Kompresi Maksimal)
          \$RemoteKey = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path RemoteKey)) New-Item -Path RemoteKey -Force | Out-Null }
          Set-ItemProperty -Path \$RemoteKey -Name "bdtLevel" -Value 0 -Force
          
          # 4. OPTIMASI NETSH TCP STACK (Internet Agresif, Throughput Gigabit, & Anti-Throttling)
          netsh int tcp set global autotuninglevel=experimental
          netsh int tcp set global congestionprovider=ctcp
          netsh int tcp set global ecn=enable
          netsh int tcp set global timestamps=disabled
          netsh int tcp set global rss=enabled
          netsh int tcp set global netdma=enabled

          # Restart Service RDP untuk menerapkan konfigurasi
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          \$password = "MR.English2008"
          securePass = ConvertTo-SecureString password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password \$securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
         
          echo "RDP_CREDS=User: RDP | Password: password" >> env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          \$tsUrl = "https://tailscale.com"
          installerPath = "env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri tsUrl -OutFile installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item \$installerPath -Force

      - name: Establish Tailscale Connection (Lean & Fast Mode)
        run: |
          # Menjalankan Tailscale tanpa beban DNS eksternal agar rute VPN langsung (Direct)
          & "\(env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\){{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-\(env:GITHUB_RUN_ID --accept-dns=false --accept-routes=true --snat-subnet-routes=false\)tsIP = \(null\)retries = 0
          while (-not tsIP -and retries -lt 10) {
              \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              \$retries++
          }
         
          if (-not \$tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV
     
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: \$env:TAILSCALE_IP"
          testResult = Test-NetConnection -ComputerName env:TAILSCALE_IP -Port 3389
          if (-not \$testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "`n=== RDP ACCESS COORD ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "========================`n"

          \$rdpProfile = "C:\Users\RDP"
          startupPath = "rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          \$downloadUrl = "https://gitlab.com"
          downloadPath = "startupPath\Downloads.bat"

          while (\$true) {
              if (Test-Path \$rdpProfile) {
                  try {
                      if (-not (Test-Path \$startupPath)) {
                          New-Item -ItemType Directory -Path \$startupPath -Force | Out-Null
                      }
                      Invoke-WebRequest -Uri downloadUrl -OutFile downloadPath -UseBasicParsing
                      cmd /c \$downloadPath
                      break
                  }
                  catch {
                      break
                  }
              }
              else {
                  Start-Sleep -Seconds 10
              }
          }

          while (\$true) {
              Start-Sleep -Seconds 300
          }
